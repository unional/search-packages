name: all-checks-noop
# Reports the `all-checks` context without verifying anything.
#
# Exists solely so `version-pr-checks.yml` can satisfy the required
# `code / all-checks` rule on the changesets release branch. The job name here and the
# caller's job name together form that context, which is why this is a reusable workflow
# rather than a plain job.
#
# Do not call this from anywhere that is meant to actually verify code.
on:
  workflow_call:

jobs:
  all-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Explain why nothing was verified
        run: |
          echo "::notice title=Verification intentionally skipped::This is the changesets"\
               "release branch. Its only content is a version bump and a changelog."
          echo ""
          echo "The package is verified on main twice, and neither run is skipped:"
          echo "  1. release.yml runs 'code' after the feature PR merges."
          echo "  2. release.yml runs 'code' again after this version PR merges,"
          echo "     and the publish job is gated behind it via 'needs: code'."
          echo ""
          echo "So nothing reaches npm unverified. Running verify a third time here"
          echo "would only re-test the same commit contents with a different version"
          echo "string, and it cannot run at all via pull_request: the version PR is"
          echo "opened with GITHUB_TOKEN, which does not trigger that event."
