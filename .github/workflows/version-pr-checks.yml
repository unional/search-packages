name: version-pr-checks
# Carves the changesets "Version Packages" PR out of verification.
#
# That PR is opened with GITHUB_TOKEN, which by design does not trigger `pull_request`
# workflows — so pull-request.yml never runs and the required `code / all-checks` context
# never appears, leaving the PR permanently unmergeable.
#
# Rather than verify a version bump, report the context and let main's existing gates do
# the real work. The job is named `code` and the callee's is named `all-checks` so the
# resulting context matches pull-request.yml's exactly, which is what branch protection
# compares against.
on:
  push:
    branches: ['changeset-release/**']

jobs:
  code:
    uses: ./.github/workflows/all-checks-noop.yml
